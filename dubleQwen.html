function updateWeather(){
  if(!user)return;
  var conditions=["☀️ Ясно","⛅ Облачно","🌧️ Дождь","⛈️ Гроза","🌨️ Снег","🌫️ Туман"];
  var temp=U.rnd(-5,30);
  weatherData={temp:temp,cond:conditions[U.rnd(0,conditions.length-1)],wind:U.rnd(0,20),humidity:U.rnd(30,90),updated:Date.now()};
  localStorage.setItem("weather_"+user.id,JSON.stringify(weatherData));
}
function getWeather(){
  if(weatherData&&Date.now()-weatherData.updated<300000)return weatherData;
  var cached=localStorage.getItem("weather_"+(user?user.id:""));
  if(cached){try{var d=JSON.parse(cached);if(Date.now()-d.updated<300000){weatherData=d;return d}}catch(e){}}
  updateWeather();return weatherData;
}

function createSlot(i){
  var nick=prompt("Ник для слота "+(i+1)+":");
  if(!nick||nick.trim().length<2)return;nick=nick.trim();
  if(db.one("users","nick",nick)){alert("Ник занят");return}
  var pw=prompt("Пароль (мин 4):");if(!pw||pw.length<4)return alert("Мин 4 символа");
  var uid=db.add("users",{nick:nick,pwh:U.hash(pw),adm:false,blk:false,accB:false,ph:"👤",rep:100});
  var dub=curDub();if(dub)giveDenoms(uid,dub.id,5000);
  db.add("creditHistory",{userId:uid,score:100,recs:[]});
  if(db.d.aid===null){db.d.aid=uid;db.upd("users",uid,{adm:true})}
  db.d.slots[i]=uid;db.sv();
  localStorage.setItem("u20",uid);user=db.get("users",uid);

}
function switchSlot(i){

}

function scamCheck(){
  if(!user)return;

  var bal=getBalance(user.id,dub.id);
  var hasDebt=db.by("fines","uid",user.id).some(function(f){return!f.paid})||db.by("credits","userId",user.id).some(function(c){return c.st==="active"});
  if(bal<3000&&hasDebt&&!localStorage.getItem("scam_"+user.id)){

function slotsGame(){md("🎰 Слоты",'<div style="text-align:center;margin:20px 0;font-size:40px"><span id="s1">🍒</span> <span id="s2">🍋</span> <span id="s3">🍊</span></div><div id="slotRes" style="text-align:center;font-weight:700"></div><input type="number" id="slotBet" class="input" value="100"><button class="btn btn-pink btn-full" onclick="spinSlots()">🎰 Крутить</button>')}
function spinSlots(){var bet=parseInt(document.getElementById("slotBet").value)||0;var dub=curDub();if(getBalance(user.id,dub.id)<bet)return alert("Недостаточно");withdrawMoney(user.id,dub.id,bet);var sym=["🍒","🍋","🍊","🍇","⭐","7️⃣","💎"];var r=[U.rnd(0,6),U.rnd(0,6),U.rnd(0,6)];document.getElementById("s1").textContent=sym[r[0]];document.getElementById("s2").textContent=sym[r[1]];document.getElementById("s3").textContent=sym[r[2]];var win=0;if(r[0]===r[1]&&r[1]===r[2])win=bet*10;else if(r[0]===r[1]||r[1]===r[2])win=bet*2;if(win>0)giveDenoms(user.id,dub.id,win);document.getElementById("slotRes").innerHTML=win>0?'<span style="color:#22c55e">+'+U.money(win)+' Ð!</span>':'<span style="color:#ef4444">Проигрыш</span>'}
function rouletteGame(){md("🎡 Рулетка",'<div id="rouletteNum" style="text-align:center;font-size:48px">🎯</div><div id="rouletteRes" style="text-align:center"></div><input type="number" id="rouletteBet" class="input" value="100"><div class="grid-2"><button class="btn btn-danger" onclick="spinRoulette(\'red\')">🔴</button><button class="btn btn-dark" onclick="spinRoulette(\'black\')">⚫</button></div>')}
function spinRoulette(color){var bet=parseInt(document.getElementById("rouletteBet").value)||0;var dub=curDub();if(getBalance(user.id,dub.id)<bet)return alert("Недостаточно");withdrawMoney(user.id,dub.id,bet);var result=U.rnd(0,36);var resColor=result===0?"green":(result%2===0?"red":"black");document.getElementById("rouletteNum").textContent=result;var win=color===resColor?bet*2:0;if(win>0)giveDenoms(user.id,dub.id,win);document.getElementById("rouletteRes").innerHTML=win>0?'<span style="color:#22c55e">+'+U.money(win)+' Ð!</span>':'<span style="color:#ef4444">Выпало '+result+'</span>'}
function diceGame(){md("🎲 Кости",'<div style="text-align:center;font-size:50px" id="diceRes">🎲🎲</div><input type="number" id="diceBet" class="input" value="100"><div class="grid-2"><button class="btn btn-success" onclick="rollDice(\'high\')">⬆️ >7</button><button class="btn btn-danger" onclick="rollDice(\'low\')">⬇️ <7</button></div>')}
function rollDice(choice){var bet=parseInt(document.getElementById("diceBet").value)||0;var dub=curDub();if(getBalance(user.id,dub.id)<bet)return alert("Недостаточно");withdrawMoney(user.id,dub.id,bet);var d1=U.rnd(1,6),d2=U.rnd(1,6);var sum=d1+d2;var win=0;if((choice==="high"&&sum>7)||(choice==="low"&&sum<7))win=bet*2;if(win>0)giveDenoms(user.id,dub.id,win);document.getElementById("diceRes").textContent=d1+" + "+d2+" = "+sum}

function flipCoin(choice){var bet=parseInt(document.getElementById("coinBet").value)||0;var dub=curDub();if(getBalance(user.id,dub.id)<bet)return alert("Недостаточно");withdrawMoney(user.id,dub.id,bet);var result=Math.random()<0.5?"heads":"tails";document.getElementById("coinIcon").textContent=result==="heads"?"👑":"🦅";var win=choice===result?bet*2:0;if(win>0)giveDenoms(user.id,dub.id,win);document.getElementById("coinRes").innerHTML=win>0?'<span style="color:#22c55e">+'+U.money(win)+' Ð!</span>':'<span style="color:#ef4444">Проигрыш</span>'}

function crashGame(){md("🚀 Краш",'<div id="crashMult" style="text-align:center;font-size:48px;font-weight:700;color:#22c55e">1.00x</div><div id="crashRes" style="text-align:center"></div><input type="number" id="crashBet" class="input" value="100"><div id="crashBtns"><button class="btn btn-success btn-full" onclick="startCrash()">🚀 Старт</button></div>')}
function startCrash(){if(crashData.running)return;var bet=parseInt(document.getElementById("crashBet").value)||0;var dub=curDub();if(getBalance(user.id,dub.id)<bet)return alert("Недостаточно");withdrawMoney(user.id,dub.id,bet);crashData.bet=bet;crashData.mult=1;crashData.running=true;document.getElementById("crashBtns").innerHTML='<button class="btn btn-danger btn-full" onclick="cashoutCrash()">💰 Забрать</button>';var crash=1+Math.random()*10;crashData.iv=setInterval(function(){crashData.mult+=0.05;document.getElementById("crashMult").textContent=crashData.mult.toFixed(2)+"x";if(crashData.mult>=crash){clearInterval(crashData.iv);crashData.running=false;document.getElementById("crashMult").style.color="#ef4444";document.getElementById("crashRes").innerHTML='<span style="color:#ef4444">💥 Краш!</span>';document.getElementById("crashBtns").innerHTML='<button class="btn btn-success btn-full" onclick="startCrash()">🚀 Ещё</button>'}},100)}

function fsbStartTrace(){
  var uid=parseInt(document.getElementById("fsbTarget").value);
  var u=db.get("users",uid);
  var box=document.getElementById("fsbGeoResult");
  box.innerHTML='<div class="geo-card" style="margin-top:12px"><div style="text-align:center"><div style="font-size:36px">🛰️</div><div style="margin:8px 0"><span class="geo-dot"></span>Устанавливаем соединение...</div></div></div>';
  logRu("ФСБ начало слежку за @"+u.nick);
  
  setTimeout(function(){
    if(!navigator.geolocation){
      box.innerHTML=fsbSimulatedTrace(u);
      return;
    }
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat=pos.coords.latitude.toFixed(6);
      var lon=pos.coords.longitude.toFixed(6);
      var acc=Math.round(pos.coords.accuracy);
      var alt=pos.coords.altitude?" · Выс "+Math.round(pos.coords.altitude)+"м":"";
      var heading=pos.coords.heading?" · Курс "+Math.round(pos.coords.heading)+"°":"";
      var speed=pos.coords.speed?" · Скор "+(pos.coords.speed*3.6).toFixed(1)+" км/ч":"";
      
      var traceLog={uid:uid,lat:lat,lon:lon,acc:acc,t:Date.now(),by:user.id};
      db.add("auditLogs",{uid:user.id,tp:"ФСБ_слежка",det:"Цель @"+u.nick+" · "+lat+","+lon,t:Date.now()});
      
      var mapUrl="https://www.openstreetmap.org/export/embed.html?bbox="+(parseFloat(lon)-0.01)+","+(parseFloat(lat)-0.01)+","+(parseFloat(lon)+0.01)+","+(parseFloat(lat)+0.01)+"&layer=mapnik&marker="+lat+","+lon;
      
      box.innerHTML='<div class="geo-card" style="margin-top:12px;border-color:#22c55e"><div style="display:flex;align-items:center;margin-bottom:12px"><span class="geo-dot"></span><span style="font-weight:700">✅ Цель обнаружена: @'+u.nick+'</span></div><div style="font-size:12px;line-height:1.8;font-family:monospace"><div>📍 <b>Координаты:</b> '+lat+', '+lon+'</div><div>🎯 <b>Точность:</b> ~'+acc+' м</div><div>🕐 <b>Время:</b> '+new Date().toLocaleString("ru")+alt+heading+speed+'</div></div><iframe src="'+mapUrl+'" style="width:100%;height:200px;border:0;border-radius:8px;margin-top:10px"></iframe><div class="grid-2 mt8"><button class="btn btn-warning btn-sm" onclick="fsbUpdateTrace('+uid+')">🔄 Обновить</button><button class="btn btn-danger btn-sm" onclick="fsbStopTrace()">⏹ Стоп</button></div><div style="font-size:10px;color:#94a3b8;margin-top:8px">⚠️ Данные отправлены в архив ФСБ. Цель уведомлена не будет.</div></div>';
      showNotif("🛰️ Цель найдена","@"+u.nick+" · "+lat+", "+lon);
    },function(err){
      box.innerHTML=fsbSimulatedTrace(u);
    },{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  },1500);
}

function fsbSimulatedTrace(u){
  // Фолбэк если браузер не даёт геолокацию
  var baseLat=55.751244+Math.random()*0.1-0.05;
  var baseLon=37.618423+Math.random()*0.1-0.05;
  var lat=baseLat.toFixed(6);
  var lon=baseLon.toFixed(6);
  var locations=["Москва, Тверская ул.","Дублика, Центральный пр.","Неизвестная точка","Ближайший лес","Кафе «У Дубли»","Метро Дублинская","Парк Республики"];
  var place=locations[U.rnd(0,locations.length-1)];
  
  db.add("auditLogs",{uid:user.id,tp:"ФСБ_слежка",det:"Симуляция: @"+u.nick+" · "+lat+","+lon+" ("+place+")",t:Date.now()});

sendPassReq=function(){
  if(isWantedMe()){alert("Пока вы в розыске, оформление паспорта недоступно");return}
  var n=document.getElementById("pN").value.trim();
  var s=document.getElementById("pS").value.trim();

      while(db.all("passports").some(function(p){return p.sur===sug})){cnt++;sug="Дубли"+cnt}
      var choice=prompt("Фамилия «Дубли» занята.\nПредлагаем: "+sug+"\n\nОК — взять "+sug+"\nИли напишите свою:");
      s=(choice&&choice.trim())?choice.trim():sug;
    }else{s="Дубли"}
  }
  var mvdId=parseInt(document.getElementById("pMvd").value);
  var mvd=db.get("factions",mvdId);
  var auto=!passReqNeedsMvdApproval();
  if(auto){
    db.add("passports",{userId:user.id,ph:document.getElementById("pPh").value||"👤",name:n,sur:s,birth:b,gen:document.getElementById("pG").value,ser:(Math.floor(Math.random()*90)+10)+" "+(Math.floor(Math.random()*90)+10),numId:U.gId(),issuer:mvd?mvd.name:"МВД Дублики",iss:Date.now(),approved:true,workplace:"Безработный"});

function scamCheck(){
  if(!user)return;
  var dub=curDub();if(!dub)return;
  var bal=getBalance(user.id,dub.id);
  var hasDebt=db.by("fines","uid",user.id).some(function(f){return!f.paid})||db.by("credits","uid",user.id).some(function(c){return c.st==="active"});
  if(bal<3000&&hasDebt&&!localStorage.getItem("scam_"+user.id)){

}

  md("📨 Неизвестный номер",

function scamAccept(){
  var dub=curDub();
  if(getBalance(user.id,dub.id)<500)return alert("Недостаточно");
  withdrawMoney(user.id,dub.id,500);
  localStorage.setItem("scam_"+user.id,"1");
  db.upd("users",user.id,{rep:Math.max(0,(user.rep||100)-10)});

  var box=document.getElementById("fsbGeoResult");
  box.innerHTML='<div style="background:#0f172a;color:#94a3b8;padding:20px;border-radius:12px;text-align:center"><div style="font-size:36px">🛰️</div><div style="margin-top:8px">Устанавливаем соединение с спутником...</div></div>';
  logRu("ФСБ начало слежку за @"+u.nick);
  setTimeout(function(){
    if(!navigator.geolocation){box.innerHTML=fsbSimulatedTrace(u);return}
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat=pos.coords.latitude.toFixed(6),lon=pos.coords.longitude.toFixed(6);
      var acc=Math.round(pos.coords.accuracy);
      var alt=pos.coords.altitude?" · Высота "+Math.round(pos.coords.altitude)+"м":"";
      var speed=pos.coords.speed?" · Скорость "+(pos.coords.speed*3.6).toFixed(1)+" км/ч":"";
      db.add("auditLogs",{uid:user.id,tp:"ФСБ_слежка",det:"Цель @"+u.nick+" · "+lat+","+lon+" (точность "+acc+"м)",t:Date.now()});
      var mapUrl="https://www.openstreetmap.org/export/embed.html?bbox="+(parseFloat(lon)-0.01)+","+(parseFloat(lat)-0.01)+","+(parseFloat(lon)+0.01)+","+(parseFloat(lat)+0.01)+"&layer=mapnik&marker="+lat+","+lon;
      box.innerHTML='<div style="background:#0f172a;color:#e2e8f0;padding:16px;border-radius:12px;border:1px solid #22c55e">'+
        '<div style="display:flex;align-items:center;margin-bottom:12px"><span style="width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:8px"></span><b style="color:#22c55e">✅ Цель обнаружена: @'+u.nick+'</b></div>'+
        '<div style="font-size:12px;line-height:1.8;font-family:monospace">'+
          '<div>📍 <b>Координаты:</b> '+lat+', '+lon+'</div>'+
          '<div>🎯 <b>Точность:</b> ~'+acc+' м</div>'+
          '<div>🕐 <b>Время:</b> '+new Date().toLocaleString("ru")+alt+speed+'</div>'+
        '</div>'+
        '<iframe src="'+mapUrl+'" style="width:100%;height:220px;border:0;border-radius:8px;margin-top:10px"></iframe>'+
        '<div class="grid-2 mt8"><button class="btn btn-warning btn-sm" onclick="fsbUpdateTrace('+uid+')">🔄 Обновить</button><button class="btn btn-danger btn-sm" onclick="fsbStopTrace()">⏹ Стоп</button></div>'+
        '<div style="font-size:10px;color:#94a3b8;margin-top:8px">⚠️ Данные в архиве ФСБ. Цель не уведомлена.</div>'+
      '</div>';
      showNotif("🛰️ Цель найдена","@"+u.nick+" · "+lat+", "+lon);
    },function(err){box.innerHTML=fsbSimulatedTrace(u)},{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  },1500);
}
function fsbSimulatedTrace(u){
  var lat=(55.75+Math.random()*0.1-0.05).toFixed(6);
  var lon=(37.62+Math.random()*0.1-0.05).toFixed(6);
  var places=["Москва, Тверская","Дублика, Центральный пр.","Кафе «У Дубли»","Метро Дублинская","Парк Республики","Лес за городом"];
  var place=places[U.rnd(0,places.length-1)];
  db.add("auditLogs",{uid:user.id,tp:"ФСБ_слежка_симул",det:"Симуляция: @"+u.nick+" · "+lat+","+lon+" ("+place+")",t:Date.now()});
  var mapUrl="https://www.openstreetmap.org/export/embed.html?bbox="+(parseFloat(lon)-0.01)+","+(parseFloat(lat)-0.01)+","+(parseFloat(lon)+0.01)+","+(parseFloat(lat)+0.01)+"&layer=mapnik&marker="+lat+","+lon;
  return '<div style="background:#0f172a;color:#e2e8f0;padding:16px;border-radius:12px;border:1px solid #f59e0b">'+
    '<div style="display:flex;align-items:center;margin-bottom:8px"><span style="width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block;margin-right:8px"></span><b style="color:#fbbf24">⚠️ Режим симуляции</b></div>'+
    '<p style="font-size:11px;color:#fbbf24;margin-bottom:8px">Браузер не дал доступ к GPS. Симулируем данные.</p>'+
    '<div style="font-size:12px;line-height:1.8;font-family:monospace">'+
      '<div>📍 <b>Цель:</b> @'+u.nick+'</div>'+
      '<div>📍 <b>Координаты:</b> '+lat+', '+lon+'</div>'+
      '<div>🏙️ <b>Место:</b> '+place+'</div>'+
    '</div>'+
    '<iframe src="'+mapUrl+'" style="width:100%;height:220px;border:0;border-radius:8px;margin-top:10px"></iframe>'+
    '<div class="grid-2 mt8"><button class="btn btn-warning btn-sm" onclick="fsbUpdateTrace('+u.id+')">🔄 Обновить</button><button class="btn btn-danger btn-sm" onclick="fsbStopTrace()">⏹ Стоп</button></div></div>';
}
function fsbUpdateTrace(uid){document.getElementById("fsbTarget").value=uid;fsbStartTrace()}
function fsbStopTrace(){clM();showNotif("⏹ Слежка прекращена","Данные в архиве ФСБ")}
function fsbTraceAll(){
  if(!canUseFSB())return alert("Только ФСБ");
  var users=db.all("users").filter(function(u){return u.id!==user.id});
  var h='<div style="max-height:400px;overflow-y:auto">';
  users.forEach(function(u){
    var lat=(55.75+Math.random()*0.1-0.05).toFixed(4);
    var lon=(37.62+Math.random()*0.1-0.05).toFixed(4);
    h+='<div class="list-item" style="background:#0f172a;color:#e2e8f0"><div class="list-item-icon">📍</div><div class="list-item-content"><div class="list-item-title">@'+u.nick+'</div><div class="list-item-sub" style="font-family:monospace;font-size:10px">'+lat+', '+lon+'</div></div><button class="btn btn-danger btn-sm" onclick="clM();fsbGeoTrace();setTimeout(function(){document.getElementById(\'fsbTarget\').value='+u.id+';fsbStartTrace()},200)">🎯</button></div>';
  });
  h+='</div>';md("📍 Все цели",h,true);
}

function openBlackMarket(){
  var goods=[
    {n:"Фальшивый паспорт",p:5000,i:"🪪",d:"Выглядит как настоящий"},
    {n:"Взломанный аккаунт",p:3000,i:"👤",d:"Чужой ник + пароль"},
    {n:"Поддельная карта",p:8000,i:"💳",d:"Без блокировок"},
    {n:"Инсайдерская инфа",p:15000,i:"📰",d:"Биржевые секреты"},
    {n:"Снятие розыска",p:25000,i:"🚨",d:"Убрать из розыска МВД"},
    {n:"Слиток золота",p:50000,i:"🟨",d:"1 кг, без вопросов"},
    {n:"Следующий тираж промокодов",p:10000,i:"🎁",d:"Коды от инсайдера"}
  ];
  var h='<div style="background:linear-gradient(135deg,#1a1a1a,#000);color:#fff;padding:16px;border-radius:16px;margin-bottom:12px;border:1px solid #dc2626">'+
    '<div style="font-size:18px;font-weight:700">🏴 Чёрный рынок Дублики</div>'+
    '<div style="font-size:11px;opacity:.7;margin-top:4px">Секретный раздел. Только для смелых.</div></div>'+
    '<div class="card"><div class="card-head">💊 Товары</div>';
  goods.forEach(function(g){
    h+='<div class="list-item"><div class="list-item-icon" style="font-size:28px">'+g.i+'</div><div class="list-item-content"><div class="list-item-title">'+g.n+'</div><div class="list-item-sub">'+U.money(g.p)+' Ð · '+g.d+'</div></div><button class="btn btn-danger btn-sm" onclick="buyBlackMarket(\''+g.n.replace(/'/g,"\\'")+'\','+g.p+',\''+g.i+'\')">💸</button></div>';
  });
  h+='</div><div class="card" style="background:#fef3c7;border:2px solid #f59e0b"><b>⚠️ ВНИМАНИЕ</b><p style="font-size:12px;margin-top:6px">Покупка снижает репутацию на 20⭐. 40% шанс попасть в розыск МВД!</p></div>';
  md("🏴 Чёрный рынок",h,true);
}
function buyBlackMarket(name,price,icon){
  var dub=curDub();
  if(getBalance(user.id,dub.id)<price)return alert("Недостаточно");
  if(!confirm("Купить «"+name+"» за "+U.money(price)+" Ð?\n\n⚠️ -20 к репутации\n⚠️ 40% шанс розыска"))return;
  withdrawMoney(user.id,dub.id,price);
  db.upd("users",user.id,{rep:Math.max(0,(user.rep||100)-20)});
  logRu("Чёрный рынок: @"+user.nick+" купил «"+name+"»");
  if(Math.random()<0.4){
    db.add("wanted",{uid:user.id,rsn:"Покупка на чёрном рынке («"+name+"»)",act:true,by:9999,d:Date.now()});
    pushSms(user.id,"🚨 МВД получило наводку! Вы в розыске за «"+name+"»");
    showNotif("🚨 Попались!","МВД объявило вас в розыск");
  }else{
    // Особые эффекты для некоторых товаров
    if(name==="Снятие розыска"){
      db.by("wanted","uid",user.id).forEach(function(w){if(w.act)db.upd("wanted",w.id,{act:false})});
      pushSms(user.id,"🏴 «"+name+"» сработал — розыск снят");
    }else if(name==="Следующий тираж промокодов"){
      var code="BLACK"+U.rnd(100,999);
      db.add("promos",{code:code,curId:dub.id,amt:5000,mx:1,used:0,usedBy:[]});
      pushSms(user.id,"🎁 Получен промокод: "+code+" (5000 Ð)");
    }else{
      pushSms(user.id,"🏴 Товар «"+name+"» получен. Репутация -20⭐");
    }
    showNotif("✅ Сделка","Получено: "+name);
  }
  clM();render();
}
