<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DubleCass V20 - Планшет</title>
    <style>
        /* --- CSS СТИЛИ --- */
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --accent: #007bff;
            --card-bg: #fff;
            --header-bg: #fff;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
            --folder-bg: #e4e9f0;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent: #bb86fc;
            --card-bg: #1e1e1e;
            --header-bg: #1e1e1e;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
            --folder-bg: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
            overflow: hidden; /* Чтобы не скроллилось лишнее */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Уведомления сверху */
        #notification-area {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notify {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-left: 5px solid var(--accent);
            animation: slideDown 0.5s ease-out;
            min-width: 250px;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Экран входа / Выбор аккаунта */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            z-index: 2000;
            position: absolute;
            width: 100%;
        }

        .account-selector {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .acc-slot {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            text-align: center;
            width: 120px;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .acc-slot:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .acc-slot.active {
            border-color: #4cd964;
            background: rgba(76, 217, 100, 0.2);
        }

        .create-btn {
            background: #4cd964;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        /* Рабочий стол (Планшет) */
        #desktop {
            display: none; /* Скрыт до входа */
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .weather-widget {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Папки и Иконки */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 20px;
        }

        .folder {
            background: var(--folder-bg);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .folder:hover {
            background: var(--accent);
            color: white;
        }

        .folder-icon {
            font-size: 40px;
            margin-bottom: 5px;
            display: block;
        }

        .folder-name {
            font-size: 12px;
            word-wrap: break-word;
        }

        /* Окно приложения */
        #app-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            display: none;
            flex-direction: column;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .app-header {
            background: var(--header-bg);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .close-app {
            background: #ff3b30;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .app-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* Элементы интерфейса внутри приложений */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        button.action-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }

        /* Стили для ДублиГрамм */
        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-item {
            padding: 10px;
            background: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
        }

        /* Админ панель */
        .admin-panel {
            border: 2px solid red;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Уведомления -->
    <div id="notification-area"></div>

    <!-- Экран входа -->
    <div id="login-screen">
        <h1>DubleCass V20</h1>
        <p>Выберите аккаунт или создайте новый</p>
        
        <div class="account-selector" id="acc-list">
            <!-- Сюда JS вставит аккаунты -->
        </div>

        <button class="create-btn" onclick="createNewAccount()">+ Новый аккаунт</button>
        
        <div style="margin-top: 30px; font-size: 12px; opacity: 0.7;">
            Код админа: <input type="text" id="admin-code-input" style="width: 100px; display:inline; padding: 5px;" placeholder="Код">
            <button onclick="checkAdmin()" style="padding: 5px;">Войти</button>
        </div>
    </div>

    <!-- Рабочий стол -->
    <div id="desktop">
        <div class="top-bar">
            <div id="user-info">Пользователь: Гость</div>
            <div class="weather-widget" id="weather-display">🌤️ Загрузка погоды...</div>
            <div>
                <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size: 20px;">🌓</button>
                <button onclick="logout()" style="background:#ff3b30; color:white; border:none; padding: 5px 10px; border-radius: 5px; margin-left: 10px; cursor:pointer;">Выход</button>
            </div>
        </div>

        <div class="folders-grid" id="apps-container">
            <!-- Папки и приложения генерируются JS -->
        </div>
    </div>

    <!-- Окно приложения -->
    <div id="app-window">
        <div class="app-header">
            <h3 id="app-title">Название приложения</h3>
            <button class="close-app" onclick="closeApp()">×</button>
        </div>
        <div class="app-content" id="app-body">
            <!-- Контент приложения -->
        </div>
    </div>

    <script>
        /* --- ЯДРО СИСТЕМЫ (CORE) --- */
        
        // База данных (в памяти, сбрасывается при обновлении страницы, если не сохранять в localStorage)
        let db = {
            users: [],
            currentUser: null,
            isAdmin: false,
            apps: [
                { id: 'passport', name: 'Паспорт', icon: '🪪', folder: 'Госуслуги' },
                { id: 'bank', name: 'Мой Банк', icon: '🏦', folder: 'Финансы' },
                { id: 'dubligram', name: 'ДублиГрамм', icon: '✈️', folder: 'Соцсети' },
                { id: 'work', name: 'Работа (hh.du)', icon: '💼', folder: 'Работа' },
                { id: 'land', name: 'Моя Земля', icon: '🗺️', folder: 'Госуслуги' },
                { id: 'mvd', name: 'МВД', icon: '👮', folder: 'Спецслужбы' },
                { id: 'fsb', name: 'ФСБ', icon: '🕵️', folder: 'Спецслужбы' },
                { id: 'court', name: 'Суд', icon: '⚖️', folder: 'Госуслуги' },
                { id: 'biz', name: 'Бизнес', icon: '📈', folder: 'Финансы' },
                { id: 'casino', name: 'Казино', icon: '🎰', folder: 'Развлечения' },
                { id: 'avito', name: 'Авито', icon: '🛒', folder: 'Интернет' },
                { id: 'dublinet', name: 'ДублиНет', icon: '🌐', folder: 'Интернет' },
                { id: 'store', name: 'DublePlay', icon: '🛍️', folder: 'Система' },
                { id: 'news', name: 'Новости', icon: '📰', folder: 'Интернет' },
                { id: 'settings', name: 'Настройки', icon: '⚙️', folder: 'Система' }
            ],
            folders: ['Работа', 'Госуслуги', 'Соцсети', 'Интернет', 'Развлечения', 'Финансы', 'Спецслужбы', 'Система'],
            newsFeed: []
        };

        // Инициализация
        window.onload = function() {
            loadDB();
            renderLogin();
            generateFakeNews();
        };

        function loadDB() {
            const saved = localStorage.getItem('dubleOS_db');
            if (saved) {
                db = JSON.parse(saved);
            } else {
                // Стартовый аккаунт если пусто
                db.users.push({
                    id: 1,
                    name: 'Администратор',
                    surname: '',
                    balance: 1000000,
                    rating: 10000,
                    passport: null,
                    role: 'admin'
                });
                saveDB();
            }
        }

        function saveDB() {
            localStorage.setItem('dubleOS_db', JSON.stringify(db));
        }

        function notify(msg, type='info') {
            const area = document.getElementById('notification-area');
            const el = document.createElement('div');
            el.className = 'notify';
            el.innerText = msg;
            if(type === 'error') el.style.borderLeftColor = 'red';
            if(type === 'success') el.style.borderLeftColor = 'green';
            area.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // Логин / Аккаунты
        function renderLogin() {
            const list = document.getElementById('acc-list');
            list.innerHTML = '';
            db.users.forEach((u, index) => {
                const div = document.createElement('div');
                div.className = 'acc-slot';
                div.innerHTML = `<div>👤</div><div>${u.name}</div>`;
                div.onclick = () => login(index);
                list.appendChild(div);
            });
        }

        function createNewAccount() {
            const name = prompt("Введите имя (Фамилия необязательна):");
            if (!name) return;
            
            // Логика фамилии "Дубли"
            let surname = "Дубли";
            const existingSurnames = db.users.filter(u => u.surname && u.surname.startsWith("Дубли")).map(u => u.surname);
            if (existingSurnames.includes("Дубли")) {
                let i = 1;
                while(existingSurnames.includes(`Дубли${i}`)) i++;
                surname = `Дубли${i}`;
            }

            const newUser = {
                id: Date.now(),
                name: name,
                surname: surname,
                balance: 5000, // Стартовый капитал
                rating: 10000, // Стартовый рейтинг
                passport: null,
                role: 'user'
            };
            db.users.push(newUser);
            saveDB();
            renderLogin();
            notify("Аккаунт создан!", "success");
        }

        function login(index) {
            db.currentUser = db.users[index];
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('desktop').style.display = 'flex';
            document.getElementById('user-info').innerText = `${db.currentUser.name} ${db.currentUser.surname || ''} | 💰 ${db.currentUser.balance} Ð | ⭐ ${db.currentUser.rating}`;
            renderDesktop();
            getWeather();
        }

        function logout() {
            db.currentUser = null;
            location.reload();
        }

        function checkAdmin() {
            const code = document.getElementById('admin-code-input').value;
            if (code === 'ADMIN') {
                db.isAdmin = true;
                notify("Режим АДМИНА включен", "success");
                // Добавляем админские аппы если нужно
            } else {
                notify("Неверный код", "error");
            }
        }

        // Рабочий стол
        function renderDesktop() {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';

            // Группировка по папкам
            db.folders.forEach(folderName => {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';
                folderDiv.innerHTML = `<span class="folder-icon">📁</span><span class="folder-name">${folderName}</span>`;
                
                // Клик по папке (упрощено: сразу открываем список приложений внутри папки в алерте или модалке, 
                // но для простоты кода сделаем так: папка - это просто визуальный блок, клик раскрывает приложения)
                // В рамках одного файла лучше сделать так: папки стоят, внутри них иконки.
                // Но grid layout сложный для вложенности. 
                // УПРОЩЕНИЕ: Папки сами являются кнопками, которые открывают "меню" с приложениями.
                
                folderDiv.onclick = () => openFolder(folderName);
                container.appendChild(folderDiv);
            });
            
            // Также добавим иконку "Все приложения" или просто рандомные ярлыки?
            // По ТЗ: Планшет с ПАПКАМИ. Значит кликаем на папку -> видим приложения.
        }

        function openFolder(folderName) {
            const appsInFolder = db.apps.filter(app => app.folder === folderName);
            let html = `<h2>Папка: ${folderName}</h2><div class="folders-grid">`;
            appsInFolder.forEach(app => {
                html += `
                <div class="folder" style="background:var(--card-bg)" onclick="openApp('${app.id}')">
                    <span class="folder-icon">${app.icon}</span>
                    <span class="folder-name">${app.name}</span>
                </div>`;
            });
            html += `</div><button class="action-btn" onclick="closeApp()" style="width:auto; margin-top:20px;">Закрыть папку</button>`;
            
            // Показываем это как модальное окно поверх рабочего стола, но не полное
            // Для простоты используем app-window, но меняем контент
            document.getElementById('app-title').innerText = folderName;
            document.getElementById('app-body').innerHTML = html;
            document.getElementById('app-window').style.display = 'flex';
        }

        // Система приложений
        function openApp(appId) {
            const app = db.apps.find(a => a.id === appId);
            if (!app) return;

            document.getElementById('app-title').innerText = app.name;
            const body = document.getElementById('app-body');
            body.innerHTML = ''; // Очистка

            // Рендер контента приложения
            switch(appId) {
                case 'passport': renderPassport(body); break;
                case 'bank': renderBank(body); break;
                case 'dubligram': renderDubligram(body); break;
                case 'work': renderWork(body); break;
                case 'mvd': renderMVD(body); break;
                case 'fsb': renderFSB(body); break;
                case 'casino': renderCasino(body); break;
                case 'settings': renderSettings(body); break;
                default: body.innerHTML = '<p>Приложение в разработке...</p>';
            }

            document.getElementById('app-window').style.display = 'flex';
        }

        function closeApp() {
            document.getElementById('app-window').style.display = 'none';
        }

        // --- ПРИЛОЖЕНИЯ ---

        function renderPassport(container) {
            const u = db.currentUser;
            if (u.passport) {
                container.innerHTML = `
                    <div class="card" style="border: 2px solid gold;">
                        <h2>🪪 ПАСПОРТ ГРАЖДАНИНА</h2>
                        <p><b>ФИО:</b> ${u.surname} ${u.name}</p>
                        <p><b>Дата рождения:</b> ${u.passport.birthdate}</p>
                        <p><b>Серия/Номер:</b> ${u.passport.number}</p>
                        <p><b>Рейтинг:</b> ${u.rating}</p>
                        <p style="color:green">Действителен</p>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="card">
                        <h2>Подача на паспорт</h2>
                        <p>Фамилия: ${u.surname} (изменить нельзя)</p>
                        <label>Дата рождения (обязательно):</label>
                        <input type="date" id="p-birth">
                        <label>Желаемый номер (необязательно):</label>
                        <input type="text" id="p-num" placeholder="Авто-генерация">
                        <button class="action-btn" onclick="submitPassport()">Подать заявление</button>
                    </div>
                `;
            }
        }

        window.submitPassport = function() {
            const date = document.getElementById('p-birth').value;
            if (!date) { notify("Дата рождения обязательна!", "error"); return; }
            
            const num = document.getElementById('p-num').value || Math.floor(Math.random()*1000000);
            db.currentUser.passport = { birthdate: date, number: num };
            saveDB();
            notify("Паспорт получен!", "success");
            renderPassport(document.getElementById('app-body'));
            updateUserInfo();
        }

        function renderBank(container) {
            const u = db.currentUser;
            container.innerHTML = `
                <div class="card" style="background: linear-gradient(45deg, #1e3c72, #2a5298); color: white;">
                    <h3>Основная карта</h3>
                    <h1>${u.balance.toLocaleString()} Ð</h1>
                    <p>**** 4582</p>
                </div>
                <div class="card">
                    <h3>Перевод</h3>
                    <input type="text" placeholder="Номер карты или телефон">
                    <input type="number" placeholder="Сумма">
                    <button class="action-btn" onclick="alert('Перевод выполнен (симуляция)')">Перевести</button>
                </div>
                <div class="card">
                    <h3>История операций</h3>
                    <ul>
                        <li>Поступление: +5000 Ð (Зарплата)</li>
                        <li>Списание: -200 Ð (Магазин)</li>
                    </ul>
                </div>
            `;
        }

        function renderDubligram(container) {
            container.innerHTML = `
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" placeholder="Поиск (@ник)" style="margin:0;">
                    <button class="action-btn" style="width:auto;">Найти</button>
                </div>
                <div class="chat-list">
                    <div class="chat-item">
                        <b>Новости DubleNet</b><br>
                        <small>Новый закон принят...</small>
                    </div>
                    <div class="chat-item">
                        <b>Чат ЖК "Лесной"</b><br>
                        <small>Сосед: Кто паркуется на моем месте?</small>
                    </div>
                    <div class="chat-item">
                        <b>МВД Официально</b><br>
                        <small>Внимание! Проводится операция...</small>
                    </div>
                </div>
                <button class="action-btn" style="margin-top:20px;" onclick="notify('Функция создания канала доступна только премиум пользователям')">Создать канал</button>
            `;
        }

        function renderWork(container) {
            container.innerHTML = `
                <h2>hh.du - Работа</h2>
                <div class="card">
                    <h3>Грузчик (ООО "Рога")</h3>
                    <p>ЗП: 30 000 Ð</p>
                    <button class="action-btn" onclick="applyJob()">Откликнуться</button>
                </div>
                <div class="card">
                    <h3>Полицейский (МВД)</h3>
                    <p>ЗП: 60 000 Ð + премии</p>
                    <p>Требования: Рейтинг > 5000</p>
                    <button class="action-btn" onclick="applyJob()">Откликнуться</button>
                </div>
            `;
        }

        window.applyJob = function() {
            notify("Отклик отправлен! Ждите звонка.", "success");
        }

        function renderMVD(container) {
            if (db.currentUser.role !== 'police' && !db.isAdmin) {
                container.innerHTML = "<h2>Доступ запрещен</h2><p>Обратитесь в участок лично.</p>";
                return;
            }
            container.innerHTML = `
                <h2>Панель МВД</h2>
                <div class="card">
                    <h3>Поиск гражданина</h3>
                    <input type="text" placeholder="ФИО или ID">
                    <button class="action-btn">Найти</button>
                </div>
                <div class="card">
                    <h3>Выписать штраф</h3>
                    <input type="text" placeholder="ID нарушителя">
                    <input type="number" placeholder="Сумма">
                    <button class="action-btn">Оформить</button>
                </div>
            `;
        }

        function renderFSB(container) {
            if (!db.isAdmin && db.currentUser.role !== 'fsb') {
                container.innerHTML = "<h2>Ошибка 403</h2><p>Нет доступа. Ваше соединение логируется.</p>";
                return;
            }
            container.innerHTML = `
                <h2>Панель ФСБ 🕵️</h2>
                <div class="card" style="border:1px solid red;">
                    <h3>Слежка</h3>
                    <p>Геолокация целей:</p>
                    <ul>
                        <li>Цель №452: ул. Ленина 5 (Онлайн)</li>
                        <li>Цель №112: Кафе "Углок"</li>
                    </ul>
                </div>
                <div class="card">
                    <h3>Перехват сообщений</h3>
                    <p><i>Чатов пока нет в буфере...</i></p>
                </div>
            `;
        }

        function renderCasino(container) {
            container.innerHTML = `
                <h2>🎰 Казино "Удача"</h2>
                <div class="card" style="text-align:center;">
                    <h1 id="slot-machine">❓ ❓ ❓</h1>
                    <p>Ставка: 1000 Ð</p>
                    <button class="action-btn" onclick="spinSlot()">КРУТИТЬ</button>
                </div>
                <p style="font-size:12px; color:gray;">Шанс выигрыша настроен в пользу казино (House Edge).</p>
            `;
        }

        window.spinSlot = function() {
            const u = db.currentUser;
            if (u.balance < 1000) { notify("Недостаточно средств!", "error"); return; }
            
            u.balance -= 1000;
            const symbols = ['🍒', '🍋', '🍉', '⭐', '7️⃣'];
            const r1 = symbols[Math.floor(Math.random()*symbols.length)];
            const r2 = symbols[Math.floor(Math.random()*symbols.length)];
            const r3 = symbols[Math.floor(Math.random()*symbols.length)];
            
            document.getElementById('slot-machine').innerText = `${r1} ${r2} ${r3}`;
            
            if (r1 === r2 && r2 === r3) {
                const win = 10000;
                u.balance += win;
                notify(`ДЖЕКПОТ! Вы выиграли ${win} Ð`, "success");
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                const win = 2000;
                u.balance += win;
                notify(`Выигрыш! +${win} Ð`, "success");
            } else {
                notify("Попробуйте еще раз...", "info");
            }
            saveDB();
            updateUserInfo();
        }

        function renderSettings(container) {
            container.innerHTML = `
                <h2>Настройки</h2>
                <div class="card">
                    <label>Тема оформления</label>
                    <button class="action-btn" onclick="toggleTheme()">Переключить Свет/Тьма</button>
                </div>
                <div class="card">
                    <h3>База данных</h3>
                    <button class="action-btn" style="background:green" onclick="exportDB()">Экспорт базы (Admin)</button>
                    <button class="action-btn" style="background:orange" onclick="importDBPrompt()">Импорт базы</button>
                </div>
                <div class="card">
                    <h3>О системе</h3>
                    <p>DubleCass V20 Full Edition</p>
                    <p>Разработано для оффлайн-игры</p>
                </div>
            `;
        }

        // --- ФУНКЦИИ СИСТЕМЫ ---

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        function updateUserInfo() {
            if(db.currentUser) {
                const u = db.currentUser;
                document.getElementById('user-info').innerText = `${u.name} ${u.surname || ''} | 💰 ${u.balance} Ð | ⭐ ${u.rating}`;
                // Обновляем в массиве users тоже
                const idx = db.users.findIndex(user => user.id === u.id);
                if(idx !== -1) db.users[idx] = u;
                saveDB();
            }
        }

        function getWeather() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    // В реальном проекте тут запрос к API. Тут симуляция для оффлайна
                    const weathers = ['☀️ +25°C', '☁️ +18°C', '🌧️ +15°C', '❄️ -5°C'];
                    const w = weathers[Math.floor(Math.random()*weathers.length)];
                    document.getElementById('weather-display').innerText = w;
                }, () => {
                    document.getElementById('weather-display').innerText = '🌤️ +20°C (Геолокация отключена)';
                });
            } else {
                document.getElementById('weather-display').innerText = '🌤️ +20°C';
            }
        }

        function generateFakeNews() {
            const titles = [
                "ЦБ повысил ставку",
                "Новый закон о паспортах",
                "В центре города открылся парк",
                "Курс криптовалюты упал",
                "МВД раскрыло банду мошенников"
            ];
            titles.forEach(t => {
                db.newsFeed.push({ title: t, date: new Date().toLocaleDateString() });
            });
        }

        // Экспорт/Импорт
        window.exportDB = function() {
            if(!db.isAdmin) { notify("Только для админа!", "error"); return; }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href",     dataStr);
            downloadAnchorNode.setAttribute("download", "duble_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        window.importDBPrompt = function() {
            const json = prompt("Вставьте JSON базы данных:");
            if(json) {
                try {
                    db = JSON.parse(json);
                    saveDB();
                    notify("База восстановлена! Перезагрузите страницу.", "success");
                } catch(e) {
                    notify("Ошибка формата JSON", "error");
                }
            }
        }

    </script>
</body>
</html>
